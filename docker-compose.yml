# RideSync stack. Services are added milestone by milestone; see README.
#
# M2 (routing):
#   python -m ridesync.data.fetch --osm          # NYC road network extract -> data/osm/nyc.osm.pbf
#   docker compose --profile prep run --rm osrm-prep   # one-off preprocessing (~5 min, ~3 GB RAM)
#   docker compose up -d osrm
#   curl "http://localhost:5000/route/v1/driving/-73.9855,40.7580;-74.0110,40.7069"

#
# M3 (live mode):
#   docker compose up -d kafka
#   python -m ridesync.live.topics                    # once; the services also create topics on start
#   python -m ridesync.live.matcher                   # terminal 1
#   python -m ridesync.live.sim --speed 10            # terminal 2

x-osrm-image: &osrm-image ghcr.io/project-osrm/osrm-backend:v6.0.0

services:
  kafka:
    # Single node in KRaft mode (no ZooKeeper). Host clients use localhost:9092;
    # containers (Flink in M4) use kafka:19092.
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    restart: unless-stopped

  osrm-prep:
    image: *osrm-image
    profiles: ["prep"]
    volumes:
      - ./data/osm:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        osrm-extract -p /opt/car.lua /data/nyc.osm.pbf;
        osrm-partition /data/nyc.osrm;
        osrm-customize /data/nyc.osrm;
        echo "OSRM data ready"

  osrm:
    image: *osrm-image
    command: >
      osrm-routed --algorithm mld --max-table-size 1000 --threads 8 /data/nyc.osrm
    volumes:
      - ./data/osm:/data:ro
    ports:
      - "5000:5000"
    mem_limit: 2g
    restart: unless-stopped

volumes:
  kafka-data:
