# RideSync stack. Services are added milestone by milestone; see README.
#
# Nothing restarts on its own (restart: "no"), so Docker Desktop starts no containers at launch.
# Plain `docker compose up -d` starts only Kafka; the rest sit behind profiles:
#   stream  -> Flink (jobmanager + taskmanager)      routing -> OSRM
#   storage -> ClickHouse, Postgres, Grafana         prep / submit -> one-off jobs
# Passwords come from .env (copy .env.example once and change them). Every port listens on 127.0.0.1 only;
# `python -m ridesync.web.share` is the one way in from outside (the live map and a read-only Grafana).
#
# When you're done: `docker compose --profile "*" stop`. A plain `docker compose stop` (or `down`)
# only acts on active profiles, i.e. Kafka alone, and leaves Flink/ClickHouse/Grafana running.
#
# M2 (routing, on demand: live demos use the fitted straight-line model):
#   python -m ridesync.data.fetch --osm          # NYC road network extract -> data/osm/nyc.osm.pbf
#   docker compose --profile prep run --rm osrm-prep   # one-off preprocessing (~5 min, ~3 GB RAM)
#   docker compose --profile routing up -d osrm
#   curl "http://localhost:5000/route/v1/driving/-73.9855,40.7580;-74.0110,40.7069"

#
# M3 (live mode):
#   docker compose up -d kafka
#   python -m ridesync.live.topics                    # once; the services also create topics on start
#   python -m ridesync.live.matcher                   # terminal 1
#   python -m ridesync.live.sim --speed 10            # terminal 2
#
# M4 (stream features, Flink UI on http://localhost:8081):
#   docker build -t ridesync-flink:1.20 docker/flink   # once
#   python -m ridesync.stream.zones                   # once: data/processed/taxi_zones.json
#   docker compose --profile stream up -d
#   docker compose --profile stream run --rm flink-submit              # submits ridesync/stream/job.py

x-osrm-image: &osrm-image ghcr.io/project-osrm/osrm-backend:v6.0.0

x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  jobmanager.memory.process.size: 800m
  taskmanager.memory.process.size: 1600m
  taskmanager.memory.managed.fraction: 0.25
  taskmanager.numberOfTaskSlots: 2
  parallelism.default: 2
  state.checkpoints.dir: file:///opt/flink/checkpoints
  python.executable: python3
  python.client.executable: python3

x-flink-volumes: &flink-volumes
  - ./ridesync:/opt/ridesync/ridesync:ro
  - ./data/processed:/opt/data:ro
  - flink-checkpoints:/opt/flink/checkpoints

services:
  kafka:
    # Single node in KRaft mode (no ZooKeeper). Host clients use localhost:9092;
    # containers (Flink in M4) use kafka:19092.
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
      - "[::1]:9092:9092"  # localhost is ::1 first on Windows
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    restart: "no"

  osrm-prep:
    image: *osrm-image
    profiles: ["prep"]
    volumes:
      - ./data/osm:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        osrm-extract -p /opt/car.lua /data/nyc.osm.pbf;
        osrm-partition /data/nyc.osrm;
        osrm-customize /data/nyc.osrm;
        echo "OSRM data ready"

  osrm:
    image: *osrm-image
    profiles: ["routing"]
    command: >
      osrm-routed --algorithm mld --max-table-size 1000 --threads ${OSRM_THREADS:-8} /data/nyc.osrm
    volumes:
      - ./data/osm:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
      - "[::1]:5000:5000"  # localhost is ::1 first on Windows
    mem_limit: 2g
    restart: "no"

  flink-jobmanager:
    profiles: ["stream"]
    image: ridesync-flink:1.20
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
      - "[::1]:8081:8081"  # localhost is ::1 first on Windows
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes: *flink-volumes
    mem_limit: 900m
    restart: "no"

  flink-taskmanager:
    profiles: ["stream"]
    image: ridesync-flink:1.20
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes: *flink-volumes
    mem_limit: 1700m
    restart: "no"

  flink-submit:
    # One-off: submits the PyFlink job to the running cluster, detached. Extra args go to the job.
    image: ridesync-flink:1.20
    profiles: ["submit"]
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes: *flink-volumes
    entrypoint: ["flink", "run", "-d", "-m", "flink-jobmanager:8081", "-py", "/opt/ridesync/ridesync/stream/job.py"]

  clickhouse:
    # Event history and time series. Reads the Kafka topics itself (docker/clickhouse/init).
    profiles: ["storage"]
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "127.0.0.1:8123:8123"
      - "[::1]:8123:8123"  # localhost is ::1 first on Windows
    environment:
      CLICKHOUSE_DB: ridesync
      CLICKHOUSE_USER: ridesync
      CLICKHOUSE_PASSWORD: ${RIDESYNC_DB_PASSWORD:?set it in .env (copy .env.example)}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env (copy .env.example)}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./docker/clickhouse/config.d/ridesync.xml:/etc/clickhouse-server/config.d/ridesync.xml:ro
      - ./docker/clickhouse/users.d/grafana.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
      - ./data/raw/taxi_zone_lookup.csv:/var/lib/clickhouse/user_files/taxi_zone_lookup.csv:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    depends_on: [kafka]
    mem_limit: 1g
    restart: "no"

  postgres:
    # Trip ledger (ridesync.sinks.postgres writes it).
    profiles: ["storage"]
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"  # localhost is ::1 first on Windows
    environment:
      POSTGRES_DB: ridesync
      POSTGRES_USER: ridesync
      POSTGRES_PASSWORD: ${RIDESYNC_DB_PASSWORD:?set it in .env (copy .env.example)}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env (copy .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    restart: "no"

  grafana:
    # Live dashboards on http://localhost:3000. Anyone can view without logging in (the share tunnel exposes it),
    # so visitors are Viewers and the datasources use read-only database users. Log in as admin to edit.
    # Dashboards live in the repo: edit docker/grafana/make_dashboard.py, run it, and Grafana picks the file up.
    profiles: ["storage"]
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"  # localhost is ::1 first on Windows
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env (copy .env.example)}
      GF_SNAPSHOTS_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env (copy .env.example)}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ridesync.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [clickhouse, postgres]
    mem_limit: 300m
    restart: "no"

volumes:
  kafka-data:
  flink-checkpoints:
  grafana-data:
  clickhouse-data:
  postgres-data:
