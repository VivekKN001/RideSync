# Grafana reads through read-only database users (docker/clickhouse/users.d, docker/postgres/init/02_roles.sh).
apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana
      defaultDatabase: ridesync
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    jsonData:
      database: ridesync
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
