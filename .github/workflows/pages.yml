name: pages

# The static replay (docs/demo) on GitHub Pages, with the write-up (docs/blog) at /blog/. The recording needs TLC
# data that isn't in the repo, so it is built locally (python -m ridesync.web.record) and committed; this only
# publishes the folders.
on:
  push:
    branches: [main]
    paths: ["docs/demo/**", "docs/blog/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Assemble the site (replay at the root, write-up at /blog/)
        run: |
          mkdir -p _site
          cp -r docs/demo/. _site/
          cp -r docs/blog _site/blog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
