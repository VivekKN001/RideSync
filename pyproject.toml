[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ridesync"
version = "0.1.0"
description = "Real-time ride-hailing dispatch: batched optimal bipartite matching vs greedy"
# PyFlink runs this package on Python 3.10/3.11, so no 3.12+ syntax.
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
live = ["confluent-kafka>=2.5"]
# M5 host services: Postgres trip-ledger sink and the live map server. (Flink runs in Docker.)
web = ["confluent-kafka>=2.5", "psycopg[binary]>=3.2", "fastapi>=0.110", "uvicorn[standard]>=0.29"]
# M6 models (training and the forecast/ETA arms). The simulator imports them only when a config asks.
ml = ["scikit-learn>=1.5", "joblib>=1.3", "pandas>=2.0", "pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["ridesync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
